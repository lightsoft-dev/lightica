<!doctype html>
<!--
  Cloudflare Access login page for Lightica (LIGH-253). A Liquid template:
  Access fills <cf-access-authbox> with its own email one-time PIN form, so it
  must appear exactly once and outside any Liquid condition. Keep message.text
  visible so sign-in errors show. Colors follow packages/ui/styles/tokens.css.
  Applied as the Lightica application's custom login page (lightsoft/access/README.md).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in to Lightica</title>
    <style>
      :root {
        color-scheme: light dark;
        --page-canvas: oklch(0.988 0 0);
        --surface: oklch(1 0 0);
        --foreground: oklch(0.141 0.005 285.823);
        --muted: oklch(0.967 0.001 286.375);
        --muted-foreground: oklch(0.505 0.016 285.938);
        --border: oklch(0.92 0.004 286.32);
        --destructive: oklch(0.577 0.245 27.325);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-canvas: oklch(0.18 0.005 285.823);
          --surface: oklch(0.21 0.006 285.885);
          --foreground: oklch(0.985 0 0);
          --muted: oklch(0.274 0.006 286.033);
          --muted-foreground: oklch(0.705 0.015 286.067);
          --border: oklch(1 0 0 / 10%);
          --destructive: oklch(0.704 0.191 22.216);
        }
        .logo { filter: invert(1); }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--page-canvas);
        color: var(--foreground);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 384px;
        overflow: hidden;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 1px 2px oklch(0 0 0 / 5%);
      }
      .header { padding: 32px 32px 8px; text-align: center; }
      .logo { display: block; width: 48px; height: 48px; margin: 0 auto 16px; }
      h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 500; letter-spacing: -0.01em; }
      .description { margin: 6px 0 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); }
      .body { padding: 16px 32px 24px; }
      .message { margin: 0 0 12px; font-size: 13px; line-height: 18px; color: var(--destructive); text-align: center; }
      .message:empty { display: none; }
      .footer {
        padding: 14px 32px;
        border-top: 1px solid var(--border);
        background: var(--muted);
        font-size: 12px;
        line-height: 16px;
        color: var(--muted-foreground);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="header">
        <img
          class="logo"
          src="https://raw.githubusercontent.com/lightsoft-dev/lightica/lightsoft/dev/lightsoft/access/lightica-login-logo.png"
          alt="Lightica"
          width="48"
          height="48"
        />
        <h1>Sign in to Lightica</h1>
        <p class="description">Enter your email to get a login code</p>
      </div>
      <div class="body">
        <p class="message">{{ message.text }}</p>
        <cf-access-authbox></cf-access-authbox>
      </div>
      <div class="footer">Lightsoft · {{ app_domain }}</div>
    </main>
  </body>
</html>
